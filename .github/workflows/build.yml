# Build RealTimeX Link for every platform RealTimeX ships for. Started by hand (Actions → Build →
# Run workflow) or by a version tag (v0.1.0): a tag also opens a draft release with the unsigned
# builds and their SHA-256 sums, which RealTimeX's signing job (Windows: Azure Trusted Signing,
# macOS: Developer ID and notarization) downloads, checks, signs and uploads again.
name: Build

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "test: macOS Intel and Linux x64 only; all: every platform"
        type: choice
        options: [test, all]
        default: test
  push:
    tags: ["v*"]
    # Work in progress builds here, not on a developer's machine.
    branches-ignore: [main]

permissions:
  contents: write

jobs:
  # Which platforms: every one for a release tag (or "all" by hand); while testing, only the
  # machines it is tried on (macOS Intel, Linux x64).
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          ALL: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.targets == 'all' }}
        run: |
          test='[
            {"name":"macos-x86_64","runner":"macos-15-intel","arch":"x86_64","script":"unix"},
            {"name":"linux-x86_64","runner":"ubuntu-24.04","arch":"x86_64","script":"unix","container":"almalinux:9"}
          ]'
          # glibc 2.34 in the Linux containers, RealTimeX's floor (Ubuntu 22.04, Debian 12, RHEL 9).
          all='[
            {"name":"macos-arm64","runner":"macos-15","arch":"arm64","script":"unix"},
            {"name":"macos-x86_64","runner":"macos-15-intel","arch":"x86_64","script":"unix"},
            {"name":"windows-x86_64","runner":"windows-2022","arch":"x86_64","script":"windows"},
            {"name":"windows-arm64","runner":"windows-11-arm","arch":"arm64","script":"windows"},
            {"name":"linux-x86_64","runner":"ubuntu-24.04","arch":"x86_64","script":"unix","container":"almalinux:9"},
            {"name":"linux-arm64","runner":"ubuntu-24.04-arm","arch":"arm64","script":"unix","container":"almalinux:9"}
          ]'
          if [ "$ALL" = "true" ]; then list="$all"; else list="$test"; fi
          echo "matrix=$(echo "$list" | tr -d '\n ')" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Tools for the container
        if: matrix.container
        run: |
          dnf install -y gcc gcc-c++ make cmake perl git binutils findutils xz >/dev/null
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      # rtx-control's VP8 encoder (libvpx) builds from source on Intel macOS, with nasm.
      - name: nasm (Intel macOS)
        if: matrix.name == 'macos-x86_64'
        run: brew install nasm
      - name: Build (macOS, Linux)
        if: matrix.script == 'unix'
        run: scripts/build.sh ${{ matrix.arch }} dist/${{ matrix.name }}
      - name: Build (Windows)
        if: matrix.script == 'windows'
        shell: pwsh
        run: scripts\build.ps1 ${{ matrix.arch }} dist\${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: realtimex-link-${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  draft-release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Archives and SHA-256 sums
        working-directory: dist
        run: |
          for dir in realtimex-link-*; do
            (cd "$dir" && chmod +x * && tar -czf "../$dir.tar.gz" *)
          done
          sha256sum realtimex-link-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Draft release (unsigned, until signed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/realtimex-link-*.tar.gz dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" --draft --title "RealTimeX Link ${GITHUB_REF_NAME}" \
            --notes "Unsigned builds. Signed builds replace them before this release is published."
