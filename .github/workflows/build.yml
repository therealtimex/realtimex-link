# Build RealTimeX Link for every platform RealTimeX ships for. This repository is a mirror; Link's
# GitLab pipeline (.gitlab-ci.yml, ci/github_build.py) starts this for each push and waits for it.
# On a version tag (v0.1.0) it also opens a draft release with the unsigned builds, the Linux
# packages and their SHA-256 sums, which RealTimeX's GitLab then signs (Windows: Azure Trusted
# Signing, macOS: Developer ID and notarization) and publishes.
#
# Supply chain: every action is pinned to a full commit SHA (the comment names its release; update
# both together), the token is read-only except in the job that makes the draft, and checkouts
# don't keep the token in .git/config.
name: Build

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "test: macOS Intel and Linux x64 only; all: every platform"
        type: choice
        options: [test, all]
        default: test

permissions:
  contents: read

jobs:
  # Which platforms: every one for a release tag (or "all" by hand); while testing, only the
  # machines it is tried on (macOS Intel, Linux x64).
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      # A release tag must be the version in Cargo.toml (the version Link reports and compares when
      # it updates itself; a tag that differs is offered as an update forever). GitLab's build job
      # checks this before it starts this run; checked again here, before anything builds, for a
      # run started by hand.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          persist-credentials: false
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false
      - name: Tag is Cargo.toml's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but Cargo.toml's version is ${version}"
            exit 1
          fi
      - id: pick
        env:
          ALL: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.targets == 'all' }}
        run: |
          test='[
            {"name":"macos-x86_64","runner":"macos-15-intel","arch":"x86_64","script":"unix"},
            {"name":"linux-x86_64","runner":"ubuntu-24.04","arch":"x86_64","script":"unix"}
          ]'
          # No Windows on ARM: RealTimeX does not ship there, and libvpx (rtx-control's live view)
          # does not build for it.
          # Linux builds on Ubuntu 24.04, like RealTimeX's own: the prebuilt libvpx is Ubuntu's, and
          # the glibc 2.34 floor (Ubuntu 22.04, Debian 12, RHEL 9) comes from rtx-glibc-compat and
          # build.sh's check of every binary's glibc references.
          all='[
            {"name":"macos-arm64","runner":"macos-15","arch":"arm64","script":"unix"},
            {"name":"macos-x86_64","runner":"macos-15-intel","arch":"x86_64","script":"unix"},
            {"name":"windows-x86_64","runner":"windows-2022","arch":"x86_64","script":"windows"},
            {"name":"linux-x86_64","runner":"ubuntu-24.04","arch":"x86_64","script":"unix"},
            {"name":"linux-arm64","runner":"ubuntu-24.04-arm","arch":"arm64","script":"unix"}
          ]'
          if [ "$ALL" = "true" ]; then list="$all"; else list="$test"; fi
          echo "matrix=$(echo "$list" | tr -d '\n ')" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Compiled dependencies (libvpx, aws-lc, egui…) kept between runs, per platform: only what
      # changed is rebuilt. Saved even when a build fails, so a fix builds fast too. Never on a
      # release tag: a release builds from scratch, so nothing a branch build left in the cache
      # (any branch can write it) ends up in a signed release, and a tag adds nothing to it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          key: ${{ matrix.name }}
          cache-on-failure: true
      # rtx-control's VP8 encoder (libvpx) builds from source on Intel macOS, with nasm.
      - name: nasm (Intel macOS)
        if: matrix.name == 'macos-x86_64'
        run: brew install nasm
      - name: Build (macOS, Linux)
        if: matrix.script == 'unix'
        run: scripts/build.sh ${{ matrix.arch }} dist/${{ matrix.name }}
      # Unit tests, once (Linux): the daemon (autostart, install, the local API), the window (its
      # theme) and the screen capture crate (its one-request-at-a-time gate, image helpers).
      - name: Test rtx-linkd, rtx-link and rtx-screens (Linux)
        if: matrix.name == 'linux-x86_64'
        # A hung test fails the step in minutes instead of holding the runner.
        timeout-minutes: 15
        run: |
          cargo test --locked -p rtx-linkd -p rtx-link -p rtx-screens
          # rtx-control's physical key table and held-key rules (#2909), and the GNOME Wayland
          # frame pipeline and virtual-monitor fallback (#9); its other tests need a desktop.
          cargo test --locked -p rtx-control -- codes:: control::tests platform::tests wayland_input::tests jobinput::
      # Lints, once (Linux): warnings show in the log; errors fail the build.
      - name: Clippy (Linux)
        if: matrix.name == 'linux-x86_64'
        run: cargo clippy --locked -p rtx-linkd -p rtx-link -p rtx-screens
      # The macOS key mapping (which key, and Shift, types each character) and the window's tests
      # on macOS (its CJK font candidates are on the runner), once (Apple silicon).
      - name: Test macOS key mapping and fonts
        if: matrix.name == 'macos-arm64'
        timeout-minutes: 15
        run: |
          cargo test --locked -p rtx-control -- platform::macos codes::
          cargo test --locked -p rtx-link
      # macOS unattended access (realtimex-link#11), on the Intel runner every build runs: the
      # launchd plists through plutil and the macOS-only checks. The job's datagrams are tested
      # on Linux, the login-window key events with the macOS key mapping (Apple silicon):
      # rtx-control's test build on Intel compiles libvpx from source again, too slow here.
      - name: Test macOS unattended access
        if: matrix.name == 'macos-x86_64'
        timeout-minutes: 15
        run: |
          cargo test --locked -p rtx-linkd -- launchd:: unattended:: autostart::
      - name: Build (Windows)
        if: matrix.script == 'windows'
        shell: pwsh
        # Also the Windows key mapping's tests (scancodes for physical keys, #2909).
        env:
          LINK_TEST_KEYS: '1'
        run: scripts\build.ps1 ${{ matrix.arch }} dist\${{ matrix.name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: realtimex-link-${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error
      # The Windows installer compiles (NSIS is on the runner). The one released is built and
      # signed on RealTimeX's GitLab, around the signed executables.
      - name: Installer compiles (Windows)
        if: matrix.script == 'windows'
        shell: pwsh
        working-directory: packaging/windows
        run: |
          $version = (Select-String -Path ..\..\Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 /DVERSION=$version /DPAYLOAD=..\..\dist\${{ matrix.name }} /DOUTFILE=$env:RUNNER_TEMP\setup.exe installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }

  draft-release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    # The only job that writes: the draft release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          # The platform builds only (a re-run can also find this job's own earlier uploads).
          pattern: realtimex-link-*
      - name: Archives and SHA-256 sums
        working-directory: dist
        run: |
          # Artifacts lose the executable bit: the programs get it back (also inside the .app).
          for dir in realtimex-link-*; do
            (cd "$dir" && find . -type f -name 'rtx-*' -exec chmod +x {} + && tar -czf "../$dir.tar.gz" *)
          done
      # Linux packages: no signing needed, so they are built here (nfpm, pinned).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: source
          persist-credentials: false
      - name: Linux packages (.deb, .rpm)
        working-directory: dist
        env:
          NFPM: "2.48.0"
          NFPM_SHA256: "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750"
        run: |
          curl -fsSL -o nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM}/nfpm_${NFPM}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum -c -
          tar -xzf nfpm.tar.gz nfpm
          VERSION="${GITHUB_REF_NAME#v}"
          for pair in x86_64:amd64:x86_64 arm64:arm64:aarch64; do
            IFS=: read -r name deb rpm <<<"$pair"
            for packager in deb rpm; do
              arch=$([ "$packager" = deb ] && echo "$deb" || echo "$rpm")
              # nfpm doesn't expand variables in file paths: the config is filled in first.
              # nfpm rejects ".." in a file path: absolute paths only.
              (cd "$GITHUB_WORKSPACE/source" && ARCH="$arch" VERSION="$VERSION" \
                PAYLOAD="$GITHUB_WORKSPACE/dist/realtimex-link-linux-$name" \
                envsubst '${ARCH} ${VERSION} ${PAYLOAD}' < packaging/linux/nfpm.yaml > nfpm.yaml && \
                "$GITHUB_WORKSPACE/dist/nfpm" package --config nfpm.yaml --packager "$packager" \
                --target "$GITHUB_WORKSPACE/dist/realtimex-link_${VERSION}_${arch}.${packager}")
            done
          done
          ls -l *.deb *.rpm
      - name: SHA-256 sums
        working-directory: dist
        run: |
          sha256sum realtimex-link-*.tar.gz realtimex-link_*.deb realtimex-link_*.rpm > SHA256SUMS
          cat SHA256SUMS
      # What this run built, kept with the run, where nothing but this run can upload: GitLab signs
      # the archives from here (release-unsigned) and checks every other file on the draft against
      # release-sums before it publishes (ci/release.py). A draft's files can be swapped by anyone
      # holding a Contents-write token; these can't.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-unsigned
          path: |
            dist/realtimex-link-macos-arm64.tar.gz
            dist/realtimex-link-macos-x86_64.tar.gz
            dist/realtimex-link-windows-x86_64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-sums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      # Building the tag again replaces its draft (a run that failed halfway can leave one with
      # some files), never a published release.
      - name: Draft release (unsigned, until signed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::release ${GITHUB_REF_NAME} is already published: it is never rebuilt"
              exit 1
            fi
            echo "replacing the earlier draft of ${GITHUB_REF_NAME}"
            gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes
          fi
          gh release create "${GITHUB_REF_NAME}" dist/realtimex-link-*.tar.gz dist/realtimex-link_*.deb \
            dist/realtimex-link_*.rpm dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" --draft --title "RealTimeX Link ${GITHUB_REF_NAME}" \
            --notes "Unsigned builds. Signed builds replace them before this release is published."
