# Build RealTimeX Link for every platform RealTimeX ships for. This repository is a mirror; Link's
# GitLab pipeline (.gitlab-ci.yml, ci/github_build.py) starts this for each push and waits for it.
# On a version tag (v0.1.0) it also opens a draft release with the unsigned builds, the Linux
# packages and their SHA-256 sums, which RealTimeX's GitLab then signs (Windows: Azure Trusted
# Signing, macOS: Developer ID and notarization) and publishes.
name: Build

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "test: macOS Intel and Linux x64 only; all: every platform"
        type: choice
        options: [test, all]
        default: test

permissions:
  contents: write

jobs:
  # Which platforms: every one for a release tag (or "all" by hand); while testing, only the
  # machines it is tried on (macOS Intel, Linux x64).
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          ALL: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.targets == 'all' }}
        run: |
          test='[
            {"name":"macos-x86_64","runner":"macos-15-intel","arch":"x86_64","script":"unix"},
            {"name":"linux-x86_64","runner":"ubuntu-24.04","arch":"x86_64","script":"unix"}
          ]'
          # No Windows on ARM: RealTimeX does not ship there, and libvpx (rtx-control's live view)
          # does not build for it.
          # Linux builds on Ubuntu 24.04, like RealTimeX's own: the prebuilt libvpx is Ubuntu's, and
          # the glibc 2.34 floor (Ubuntu 22.04, Debian 12, RHEL 9) comes from rtx-glibc-compat and
          # build.sh's check of every binary's glibc references.
          all='[
            {"name":"macos-arm64","runner":"macos-15","arch":"arm64","script":"unix"},
            {"name":"macos-x86_64","runner":"macos-15-intel","arch":"x86_64","script":"unix"},
            {"name":"windows-x86_64","runner":"windows-2022","arch":"x86_64","script":"windows"},
            {"name":"linux-x86_64","runner":"ubuntu-24.04","arch":"x86_64","script":"unix"},
            {"name":"linux-arm64","runner":"ubuntu-24.04-arm","arch":"arm64","script":"unix"}
          ]'
          if [ "$ALL" = "true" ]; then list="$all"; else list="$test"; fi
          echo "matrix=$(echo "$list" | tr -d '\n ')" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      # Compiled dependencies (libvpx, aws-lc, egui…) kept between runs, per platform: only what
      # changed is rebuilt. Saved even when a build fails, so a fix builds fast too.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          cache-on-failure: true
      # rtx-control's VP8 encoder (libvpx) builds from source on Intel macOS, with nasm.
      - name: nasm (Intel macOS)
        if: matrix.name == 'macos-x86_64'
        run: brew install nasm
      - name: Build (macOS, Linux)
        if: matrix.script == 'unix'
        run: scripts/build.sh ${{ matrix.arch }} dist/${{ matrix.name }}
      # Unit tests, once (Linux): the daemon (autostart, install, the local API) and the screen
      # capture crate (its one-request-at-a-time gate, image helpers).
      - name: Test rtx-linkd and rtx-screens (Linux)
        if: matrix.name == 'linux-x86_64'
        run: cargo test --locked -p rtx-linkd -p rtx-screens
      - name: Build (Windows)
        if: matrix.script == 'windows'
        shell: pwsh
        run: scripts\build.ps1 ${{ matrix.arch }} dist\${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: realtimex-link-${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error
      # The Windows installer compiles (NSIS is on the runner). The one released is built and
      # signed on RealTimeX's GitLab, around the signed executables.
      - name: Installer compiles (Windows)
        if: matrix.script == 'windows'
        shell: pwsh
        working-directory: packaging/windows
        run: |
          $version = (Select-String -Path ..\..\Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 /DVERSION=$version /DPAYLOAD=..\..\dist\${{ matrix.name }} /DOUTFILE=$env:RUNNER_TEMP\setup.exe installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }

  draft-release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Archives and SHA-256 sums
        working-directory: dist
        run: |
          # Artifacts lose the executable bit: the programs get it back (also inside the .app).
          for dir in realtimex-link-*; do
            (cd "$dir" && find . -type f -name 'rtx-*' -exec chmod +x {} + && tar -czf "../$dir.tar.gz" *)
          done
      # Linux packages: no signing needed, so they are built here (nfpm, pinned).
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Linux packages (.deb, .rpm)
        working-directory: dist
        env:
          NFPM: "2.48.0"
          NFPM_SHA256: "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750"
        run: |
          curl -fsSL -o nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM}/nfpm_${NFPM}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum -c -
          tar -xzf nfpm.tar.gz nfpm
          VERSION="${GITHUB_REF_NAME#v}"
          for pair in x86_64:amd64:x86_64 arm64:arm64:aarch64; do
            IFS=: read -r name deb rpm <<<"$pair"
            for packager in deb rpm; do
              arch=$([ "$packager" = deb ] && echo "$deb" || echo "$rpm")
              # nfpm doesn't expand variables in file paths: the config is filled in first.
              # nfpm rejects ".." in a file path: absolute paths only.
              (cd "$GITHUB_WORKSPACE/source" && ARCH="$arch" VERSION="$VERSION" \
                PAYLOAD="$GITHUB_WORKSPACE/dist/realtimex-link-linux-$name" \
                envsubst '${ARCH} ${VERSION} ${PAYLOAD}' < packaging/linux/nfpm.yaml > nfpm.yaml && \
                "$GITHUB_WORKSPACE/dist/nfpm" package --config nfpm.yaml --packager "$packager" \
                --target "$GITHUB_WORKSPACE/dist/realtimex-link_${VERSION}_${arch}.${packager}")
            done
          done
          ls -l *.deb *.rpm
      - name: SHA-256 sums
        working-directory: dist
        run: |
          sha256sum realtimex-link-*.tar.gz realtimex-link_*.deb realtimex-link_*.rpm > SHA256SUMS
          cat SHA256SUMS
      - name: Draft release (unsigned, until signed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/realtimex-link-*.tar.gz dist/realtimex-link_*.deb \
            dist/realtimex-link_*.rpm dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" --draft --title "RealTimeX Link ${GITHUB_REF_NAME}" \
            --notes "Unsigned builds. Signed builds replace them before this release is published."
