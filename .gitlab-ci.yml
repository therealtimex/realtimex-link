# Temporary: why Link's keychain check behaves differently on the M4 (read-only diagnostics).
m4-keychain-diag:
  tags: [usa-macmini-m4]
  script:
    - |
      echo "user=$(whoami) HOME=$HOME console=$(stat -f %Su /dev/console)"
      echo "launchd session = $(launchctl managername 2>&1)"
      echo "gitlab-runner launchd jobs:"; ls /Library/LaunchDaemons ~/Library/LaunchAgents 2>/dev/null | grep -i gitlab || true
      echo "keychain search list:"; security list-keychains
      echo "default keychain:"; security default-keychain
      ls -l ~/Library/Keychains/ | grep -i login || true
      security show-keychain-info Login.keychain; echo "show-keychain-info Login.keychain exit=$?"
      security show-keychain-info login.keychain-db; echo "show-keychain-info login.keychain-db exit=$?"
      echo "codesign identities:"; security find-identity -v -p codesigning | grep -c "Developer ID Application"
