# RealTimeX Link's pipeline. Code lives here; GitHub (github.com/therealtimex/realtimex-link, a
# public push mirror of this repository) has the build machines, and RealTimeX's release runners
# sign. So:
#
# - build: every push builds on GitHub Actions (ci/github_build.py starts the run for this commit
#   and waits for it); a vX.Y.Z tag builds every platform into a draft release. A tag that isn't
#   Cargo.toml's version fails here, before anything builds.
# - verify (vX.Y.Z tags): ci/release.py fetch checks where the release comes from (GitLab's tag
#   commit = the mirror's tag = the commit the build run built; Cargo.toml says the version) and
#   takes the archives to sign from that run's own Actions artifacts, never from the draft (whose
#   files anyone with a Contents-write token could swap), plus packaging/ from the tag's tree. The
#   sign jobs get them as GitLab artifacts, so the signing runners never hold the GitHub token.
# - sign (vX.Y.Z tags): macOS on each architecture's Mac runner (Developer ID, hardened runtime,
#   notarized, stapled; the signed archive and a .dmg, ci/sign-mac.sh); Windows on the Windows
#   runner (Azure Trusted Signing; the signed archive and the installer, ci/sign-win.ps1).
# - publish (vX.Y.Z tags): once every other file on the draft is checked against what the build run
#   recorded, the signed files replace or join the draft's assets, SHA256SUMS is rewritten and the
#   draft is published as a pre-release, never as Link's latest (ci/release.py): installed Links
#   update from releases/latest, which skips pre-releases, so RealTimeX can pin and test it first.
#   A published release's files are never changed.
# - promote (the Human's go): the vX.Y.Z tag pipeline's manual promote job makes the pre-release a
#   release, Link's latest only if no newer release is out. For a version whose tag pipeline had
#   no promote job (v0.2.0), Run pipeline on main with LINK_PROMOTE_VERSION=X.Y.Z.
# - Sign again without building (a signing fix): Run pipeline on main with LINK_SIGN_VERSION=X.Y.Z
#   signs and publishes that existing draft release with this commit's ci/ scripts; the .dmg and
#   installer scripts still come from the tag's tree. The same checks hold, against GitLab's own
#   vX.Y.Z tag and the newest successful build run of it (no build job runs to name one).
#
# Releasing is for protected refs only: a vX.Y.Z tag pipeline signs only when v* tags are protected
# (Settings → Repository → Protected tags), and signing again runs only on the protected default
# branch. Anything else that asks for a release gets one failing job saying why.
#
# CI variables: GITHUB_LINK_TOKEN (the mirror: Contents read/write and Actions read/write; the
# verify and publish jobs read Actions artifacts with it), and the signing credentials RealTimeX's
# own releases use: CSC_NAME, KEYCHAIN, KEYCHAIN_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
# APPLE_TEAM_ID, AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET.

stages:
  - build
  - verify
  - sign
  - publish

variables:
  # build and publish only wait on GitHub and upload files: link-ci, Link's own shell runner (two
  # jobs at once, in the realtimex-builder container on the office-80 server), so they never queue
  # behind RealTimeX's release builds or MR checks.
  LINK_CI_RUNNER_TAG: link-ci

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      variables:
        RELEASE_VERSION: $CI_COMMIT_TAG
    - if: '$LINK_SIGN_VERSION =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/ && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      variables:
        RELEASE_VERSION: $LINK_SIGN_VERSION
    - if: '$LINK_PROMOTE_VERSION =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/ && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      variables:
        PROMOTE_VERSION: $LINK_PROMOTE_VERSION
    # A version tag that isn't protected, or LINK_SIGN_VERSION / LINK_PROMOTE_VERSION anywhere
    # else: only release-refused.
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ || $LINK_SIGN_VERSION || $LINK_PROMOTE_VERSION'
      variables:
        LINK_RELEASE_REFUSED: "true"
    - if: '$CI_COMMIT_BRANCH'

release-refused:
  stage: build
  rules:
    - if: '$LINK_RELEASE_REFUSED == "true"'
  tags:
    - $LINK_CI_RUNNER_TAG
  script:
    - echo "Releases are signed from protected refs only. A vX.Y.Z tag needs v* tags protected (Settings → Repository → Protected tags), then delete and push the tag again; LINK_SIGN_VERSION and LINK_PROMOTE_VERSION run on the protected default branch only. This pipeline (${CI_COMMIT_REF_NAME}, protected=${CI_COMMIT_REF_PROTECTED}) signs nothing."
    - exit 1

build:
  stage: build
  rules:
    # Signing an existing draft again or promoting builds nothing; a refused release neither.
    - if: '$LINK_SIGN_VERSION || $PROMOTE_VERSION || $LINK_RELEASE_REFUSED == "true"'
      when: never
    - when: on_success
  # A newer push to the same branch cancels this one (Settings → CI/CD → Auto-cancel redundant
  # pipelines): only the latest commit's build matters.
  interruptible: true
  tags:
    - $LINK_CI_RUNNER_TAG
  timeout: 3h
  script:
    - python3 -u ci/github_build.py
  artifacts:
    # LINK_BUILD_RUN_ID and LINK_BUILD_SHA: the run verify and publish take the release from.
    reports:
      dotenv: build.env

.release:
  rules:
    - if: '$RELEASE_VERSION'

verify:
  extends: .release
  stage: verify
  needs:
    - job: build
      optional: true
  tags:
    - $LINK_CI_RUNNER_TAG
  timeout: 30m
  script:
    - python3 -u ci/release.py fetch "$RELEASE_VERSION" link-unsigned
  artifacts:
    expire_in: 7 days
    paths:
      - link-unsigned/

# The signing runners get the verified files from verify (and no GitHub token).
.sign-mac:
  extends: .release
  stage: sign
  needs: [verify]
  timeout: 1h
  script:
    - bash ci/sign-mac.sh "${RELEASE_VERSION#v}" "$CPU_ARCH" link-unsigned link-signed
  artifacts:
    expire_in: 30 days
    paths:
      - link-signed/

sign-mac-arm64:
  extends: .sign-mac
  tags:
    - usa-macmini-m4
  variables:
    CPU_ARCH: arm64

sign-mac-x86_64:
  extends: .sign-mac
  tags:
    - usa-imac-pro-01
  variables:
    CPU_ARCH: x86_64

sign-win:
  extends: .release
  stage: sign
  needs: [verify]
  timeout: 1h
  tags:
    - office-win-dell
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File ci\sign-win.ps1 -Version ($env:RELEASE_VERSION -replace '^v','') -In link-unsigned -Out link-signed
    - if ($LASTEXITCODE -ne 0) { throw "sign-win failed" }
  artifacts:
    expire_in: 30 days
    paths:
      - link-signed/

publish:
  extends: .release
  stage: publish
  needs:
    # The build job's dotenv report (which run built the tag); none when signing again.
    - job: build
      optional: true
    - sign-mac-arm64
    - sign-mac-x86_64
    - sign-win
  # Only Python and the network: the shared pool, not a release runner.
  tags:
    - $LINK_CI_RUNNER_TAG
  script:
    - python3 -u ci/release.py publish "$RELEASE_VERSION" link-signed

# The Human's go: the published pre-release becomes a release (ci/release.py promote). Manual on a
# vX.Y.Z tag pipeline, after publish; on main with LINK_PROMOTE_VERSION for an earlier version.
promote:
  stage: publish
  rules:
    - if: '$PROMOTE_VERSION'
      variables:
        RELEASE_VERSION: $PROMOTE_VERSION
    - if: '$CI_COMMIT_TAG && $RELEASE_VERSION'
      when: manual
  needs:
    - job: publish
      optional: true
  tags:
    - $LINK_CI_RUNNER_TAG
  script:
    - python3 -u ci/release.py promote "$RELEASE_VERSION"
