# RealTimeX Link's pipeline. Code lives here; GitHub (github.com/therealtimex/realtimex-link, a
# public push mirror of this repository) has the build machines, and RealTimeX's release runners
# sign. So:
#
# - build: every push builds on GitHub Actions (ci/github_build.py starts the run for this commit
#   and waits for it); a vX.Y.Z tag builds every platform into a draft release.
# - sign (vX.Y.Z tags): macOS on each architecture's Mac runner (Developer ID, hardened runtime,
#   notarized, stapled; the signed archive and a .dmg, ci/sign-mac.sh); Windows on the Windows
#   runner (Azure Trusted Signing; the signed archive and the installer, ci/sign-win.ps1).
# - publish (vX.Y.Z tags): the signed files replace or join the draft's assets, SHA256SUMS is
#   rewritten and the release is published as Link's latest (ci/release.py).
#
# CI variables: GITHUB_LINK_TOKEN (the mirror: Contents and Actions read/write), and the signing
# credentials RealTimeX's own releases use: CSC_NAME, KEYCHAIN, KEYCHAIN_PASSWORD, APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID, AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET.

stages:
  - build
  - sign
  - publish

variables:
  # build and publish only wait on GitHub and upload files: link-ci, Link's own shell runner (two
  # jobs at once, in the realtimex-builder container on the office-80 server), so they never queue
  # behind RealTimeX's release builds or MR checks.
  LINK_CI_RUNNER_TAG: link-ci

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH'

build:
  stage: build
  # A newer push to the same branch cancels this one (Settings → CI/CD → Auto-cancel redundant
  # pipelines): only the latest commit's build matters.
  interruptible: true
  tags:
    - $LINK_CI_RUNNER_TAG
  timeout: 3h
  script:
    - python3 -u ci/github_build.py

.release:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

.sign-mac:
  extends: .release
  stage: sign
  needs: [build]
  timeout: 1h
  script:
    - ci/sign-mac.sh "${CI_COMMIT_TAG#v}" "$CPU_ARCH" link-signed
  artifacts:
    expire_in: 30 days
    paths:
      - link-signed/

sign-mac-arm64:
  extends: .sign-mac
  tags:
    - usa-macmini-m4
  variables:
    CPU_ARCH: arm64

sign-mac-x86_64:
  extends: .sign-mac
  tags:
    - office-macmini-200
  variables:
    CPU_ARCH: x86_64

sign-win:
  extends: .release
  stage: sign
  needs: [build]
  timeout: 1h
  tags:
    - office-win-dell
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File ci\sign-win.ps1 -Version ($env:CI_COMMIT_TAG -replace '^v','') -Out link-signed
    - if ($LASTEXITCODE -ne 0) { throw "sign-win failed" }
  artifacts:
    expire_in: 30 days
    paths:
      - link-signed/

publish:
  extends: .release
  stage: publish
  needs: [sign-mac-arm64, sign-mac-x86_64, sign-win]
  # Only Python and the network: the shared pool, not a release runner.
  tags:
    - $LINK_CI_RUNNER_TAG
  script:
    - python3 -u ci/release.py publish "$CI_COMMIT_TAG" link-signed
