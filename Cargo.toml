[workspace]
resolver = "2"
members = ["crates/glibc-compat", "crates/screens", "crates/control", "crates/linkd", "crates/link"]

[workspace.package]
version = "0.1.11"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Dependencies are optimized in dev and test builds too: video encoding and image scaling touch
# every pixel and are far too slow unoptimized for a live view in a dev build.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.rtx-screens]
opt-level = 2
