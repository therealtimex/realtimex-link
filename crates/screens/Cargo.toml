[package]
name = "rtx-screens"
description = "Window and display screenshots shared by RealTimeX's recorder (rtx-capture) and Remote Control (rtx-control): capture only, no input"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Both executables link this package, so it stays capture-only: no input, keyboard, clipboard or
# Remote Control dependencies or features here. RealTimeX's no-keyboard check scans this
# package's sources and dependencies as part of the recorder (realtimex-ai-app,
# native/rtx-capture/scripts/no-keyboard.json).
[dependencies]
anyhow.workspace = true
# JPEG for screenshots (image.rs).
jpeg-encoder = "0.7"
serde.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
# The live view's display stream (macos_stream.rs, #2683).
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-foundation = "0.3"
# Not the default features: they include CGEvent, CGEventSource and CGRemoteOperation (input
# events), which the recorder's dependency graph must not have.
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CGBase", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDirectDisplay", "CGImage"] }
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = "0.3"
objc2-image-io = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "objc2-image-io", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNObservation", "VNTypes"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The live view's System V shared memory for X11 (#2683).
libc.workspace = true
# shm: the live view reads the screen through shared memory (#2683).
x11rb = { version = "0.14", default-features = false, features = ["randr", "shm"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_Xps", "Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Security_Cryptography", "Storage_Streams"] }
