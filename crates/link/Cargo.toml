[package]
name = "rtx-link"
description = "RealTimeX Link's window and menu bar / tray icon, on top of the rtx-linkd daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The window only (#2753): it talks to rtx-linkd over its local API and starts it when it is not
# running. No capture, input or hosting code here.
[dependencies]
anyhow.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
# eframe's own winit, with the Adwaita title bar on Wayland: GNOME draws no server-side decorations,
# and without this feature winit falls back to plain rectangles for its buttons. X11, macOS and
# Windows are unaffected (the window manager or OS draws the title bar).
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3.5.0", features = ["json"] }
rtx-glibc-compat = { path = "../glibc-compat" }
# The local API's /v1/hello proof (HMAC-SHA256) and its nonce; already rtx-linkd's and rustls'.
ring = "0.17"
# The menu bar (macOS) and tray (Windows, Linux) icon. On Linux the StatusNotifierItem backend
# (D-Bus, its own thread): no GTK; GNOME shows it with the AppIndicator extension (Ubuntu's default).
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
# Chinese, Japanese and Korean (cjk.rs): a system font's faces and characters, with epaint's own
# font reader (same version), mapped from disk rather than copied.
skrifa = "0.44.0"
memmap2 = "0.9.12"

# macOS: in the Dock only while the window is open (dock.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
# The process name, which winit's app menu uses (dock.rs).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

# The .exe's icon, version information and manifest (build.rs, crates/windows_resources.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
