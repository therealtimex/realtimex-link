[package]
name = "rtx-linkd"
description = "RealTimeX Link's hosting daemon: this computer's App ID, password and clients, and the listener other computers control it through"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Hosting only (#2753): the network side of being controlled. Capture, input and the clipboard
# stay in rtx-control, which this daemon runs as its helper (JSON lines on stdin and stdout), so
# the reviewed boundary between rtx-capture and rtx-control is unchanged.
[dependencies]
aes-gcm = "0.10.3"
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
# The relay (relay.rs): its HTTP stream bodies, the WebSocket to it (rustls with ring, chosen in
# main.rs), the Remote Control routes called in-process, and the Marketplace API (blocking, rare).
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
ureq = { version = "3.5.0", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
if-addrs = "0.15"
libc.workspace = true
rtx-glibc-compat = { path = "../glibc-compat" }
rand = "0.9"
# SQLite built in: the same remote-host.db the JavaScript daemon keeps (one data folder).
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
subtle = "2.6"
tokio-stream = "0.1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target."cfg(windows)".dependencies]
# A pasted image's CF_DIB is made from its PNG (dib.rs).
png = "0.17"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading"] }


[dev-dependencies]
tempfile = "3"
